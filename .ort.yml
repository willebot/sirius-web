excludes:
  scopes:
    - pattern: "devDependencies"
      reason: "BUILD_TOOL_OF"
      comment: "Workspace devDependencies contain cross-workspace @eclipse-sirius/*
        references that ORT cannot resolve (workspace link:true entries resolve to
        projects, not packages). Excluding devDependencies prevents ORT from
        traversing these intra-workspace edges and failing the analyzer."
    - pattern: "peerDependencies"
      reason: "PROVIDED_BY"
      comment: "All 22 component library workspace packages declare sibling
        @eclipse-sirius/* packages as peerDependencies. ORT follows the link:true
        node_modules entries for these, builds valid identifiers, then cannot find
        them in the packages map (they are projects). Excluding peerDependencies
        removes this path entirely."
